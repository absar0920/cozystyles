# Local MySQL-compatible database matching Hostinger's managed MySQL (MariaDB).
#   npm run db:up      start it (data persists in the iw-mysql volume)
#   npm run db:down    stop it
services:
  mysql:
    image: mariadb:11.4
    container_name: interwood-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: interwood
      MARIADB_DATABASE: interwood
      MARIADB_USER: interwood
      MARIADB_PASSWORD: interwood
    ports:
      - "3307:3306"
    volumes:
      - iw-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
volumes:
  iw-mysql:
